name: Packpier checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: make bootstrap
      - run: make check
